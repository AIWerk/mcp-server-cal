# Smithery configuration file — https://smithery.ai/docs
#
# Describes how Smithery should spawn @aiwerk/mcp-server-cal on stdio.
# The package is published to npm; Smithery uses `npx -y` to fetch and run.

startCommand:
  type: stdio
  configSchema:
    # JSON Schema for user-supplied configuration.
    type: object
    required:
      - calApiKey
    properties:
      calApiKey:
        type: string
        title: Cal.com API Key
        description: >-
          Personal API key from Cal.com Settings → Developer → API Keys.
          Typically prefixed with `cal_` or `cal_live_`. Required for all tool calls.
          `tools/list` works without it.
      calBaseUrl:
        type: string
        title: Cal.com API Base URL
        description: >-
          Override the Cal.com v2 API base URL. Defaults to
          `https://api.cal.com/v2`. Only change this if you are self-hosting Cal.com.
        default: https://api.cal.com/v2
  commandFunction:
    |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@aiwerk/mcp-server-cal@1.0.3'],
      env: {
        CAL_API_KEY: config.calApiKey,
        ...(config.calBaseUrl ? { CAL_BASE_URL: config.calBaseUrl } : {})
      }
    })
